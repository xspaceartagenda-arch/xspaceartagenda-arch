name: Build Aurum v0.7.10 Rollback v0.7.8

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Aurum-AI-37-v0.7.10-ROLLBACK-v078-GITHUB-BUILD.zip'
      - '.github/workflows/build-standalone-v0.7.10-rollback-v078.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract rollback source package
        run: |
          rm -rf standalone
          mkdir standalone
          unzip -q Aurum-AI-37-v0.7.10-ROLLBACK-v078-GITHUB-BUILD.zip -d standalone
          WRAPPER="$(find standalone -type f -name gradlew | head -1)"
          test -n "$WRAPPER"
          chmod +x "$WRAPPER"

      - name: Verify exact v0.7.8 behavior and run host tests
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$(dirname "$(find standalone -type f -name gradlew | head -1)")"
          cd "$ROOT"
          python3 tools/v0710_rollback_validation.py
          rm -rf /tmp/aurum-host-tests
          mkdir -p /tmp/aurum-host-tests
          javac -encoding UTF-8 -source 17 -target 17 -d /tmp/aurum-host-tests \
            app/src/main/java/com/xspaceart/radar30/core/*.java \
            app/src/main/java/com/xspaceart/radar30/RadarBackstageFormatter.java \
            app/src/main/java/com/xspaceart/radar30/integrated/IntegratedSignalBridge.java \
            app/src/main/java/com/xspaceart/radar30/integrated/normalize/*.java \
            app/src/main/java/com/xspaceart/radar30/integrated/scanner/SourceHunter.java \
            app/src/main/java/com/xspaceart/radar30/integrated/scanner/HistoryQualityGate.java \
            app/src/main/java/com/xspaceart/radar30/integrated/scanner/HistoryAgreement.java \
            app/src/main/java/com/xspaceart/radar30/integrated/pipeline/ReadingPipelineController.java \
            tools/PrecisionCoreTest.java tools/DualTargetCoreTest.java \
            tools/V063BalancedCalibrationTest.java tools/IntegratedOperationalTest.java \
            tools/SourceOrderTrackerTest.java tools/ManualEchoReconcilerTest.java \
            tools/ReadingPipelineControllerTest.java tools/HistoryQualityGateTest.java \
            tools/HistoryAgreementTest.java tools/V076FastTrackPolicyTest.java \
            tools/V076RadarBackstageTest.java tools/V077ConsensusSpatialTest.java \
            tools/V077ConsensusPolicyTest.java tools/V077CadenceTest.java \
            tools/V077SaturationTest.java tools/V077RadarExplainabilityTest.java \
            tools/V078TerminalConsensusTest.java tools/V078TerminalPolicyTest.java \
            tools/V078TerminalValidityTest.java
          for t in PrecisionCoreTest DualTargetCoreTest V063BalancedCalibrationTest IntegratedOperationalTest SourceOrderTrackerTest ManualEchoReconcilerTest ReadingPipelineControllerTest HistoryQualityGateTest HistoryAgreementTest V076FastTrackPolicyTest V076RadarBackstageTest V077ConsensusSpatialTest V077ConsensusPolicyTest V077CadenceTest V077SaturationTest V077RadarExplainabilityTest V078TerminalConsensusTest V078TerminalPolicyTest V078TerminalValidityTest; do
            java -cp /tmp/aurum-host-tests "$t"
          done

      - name: Build signed debug rollback update
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$(dirname "$(find standalone -type f -name gradlew | head -1)")"
          cd "$ROOT"
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Audit package version launcher signature and alignment
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find standalone -type f -path '*/build/outputs/apk/debug/*.apk' | head -1)"
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" artifact/Aurum-AI-37-v0.7.10-Rollback-v078-STABLE.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt2" dump badging artifact/Aurum-AI-37-v0.7.10-Rollback-v078-STABLE.apk | tee artifact/BADGING.txt
          grep -q "package: name='com.xspaceart.aurumai37.integratedlab.debug' versionCode='11' versionName='0.7.10-rollback-v078-debug'" artifact/BADGING.txt
          grep -q "launchable-activity: name='com.xspaceart.radar30.StandaloneActivity'" artifact/BADGING.txt
          "$BT/apksigner" verify --verbose --print-certs artifact/Aurum-AI-37-v0.7.10-Rollback-v078-STABLE.apk | tee artifact/SIGNATURE.txt
          grep -qi '663a96b89181b13c759512229e465ebc895136545f36d1cbd29f7d7e1ad561c4' artifact/SIGNATURE.txt
          "$BT/zipalign" -c -P 16 4 artifact/Aurum-AI-37-v0.7.10-Rollback-v078-STABLE.apk
          unzip -t artifact/Aurum-AI-37-v0.7.10-Rollback-v078-STABLE.apk >/dev/null
          sha256sum artifact/Aurum-AI-37-v0.7.10-Rollback-v078-STABLE.apk | tee artifact/SHA256SUMS.txt
          printf 'IMPLEMENTED=PASS\nROLLBACK_BASE=V078\nV078_BEHAVIOR_PRESERVED=PASS\nSURGICAL_V079=ABSENT\nHOST_TESTS=PASS\nTERMINAL_MODEL=V078_PRESERVED\nSECTOR_MODEL=V078_PRESERVED\nMAX_CROSS_CONFLUENCE=V078_PRESERVED\nCOMPILED=PASS\nPACKAGE=PASS\nVERSION_ORDER_OVER_V079=PASS\nLAUNCHER_STANDALONE=PASS\nSIGNATURE=PASS\nALIGNMENT=PASS\nPHYSICAL_S25FE=PENDING\n' | tee artifact/BUILD_STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Aurum-AI-37-v0.7.10-Rollback-v078
          path: artifact/
          if-no-files-found: error
          retention-days: 7
