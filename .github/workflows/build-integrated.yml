name: Build Aurum v0.7.3 Stability Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'Aurum-AI-37-Integrated-LAB-GITHUB-BUILD.zip'
      - '.github/workflows/build-integrated.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract source package
        run: |
          rm -rf integrated
          mkdir integrated
          unzip -q Aurum-AI-37-Integrated-LAB-GITHUB-BUILD.zip -d integrated
          WRAPPER="$(find integrated -type f -name gradlew | head -1)"
          test -n "$WRAPPER"
          chmod +x "$WRAPPER"

      - name: Verify frozen CORE and host tests
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$(dirname "$(find integrated -type f -name gradlew | head -1)")"
          cd "$ROOT"
          python3 tools/v073_static_validation.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          core=Path('app/src/main/java/com/xspaceart/radar30/core')
          expected=Path('CORE_PRESERVATION_SHA256.txt').read_text().splitlines()
          checked=0
          for line in expected:
              m=re.match(r'([0-9a-f]{64})\s+(.+)$',line.strip())
              if not m: continue
              checked += 1
              digest,name=m.groups()
              path=core/name
              assert path.exists(), f'missing core file: {name}'
              got=hashlib.sha256(path.read_bytes()).hexdigest()
              assert got==digest, f'CORE drift: {name}'
          assert checked==17, f'unexpected core manifest size: {checked}'
          print('CORE_PRESERVATION=PASS checked=17')
          PY
          rm -rf /tmp/aurum-host-tests
          mkdir -p /tmp/aurum-host-tests
          javac -source 17 -target 17 -d /tmp/aurum-host-tests \
            app/src/main/java/com/xspaceart/radar30/core/*.java \
            app/src/main/java/com/xspaceart/radar30/integrated/IntegratedSignalBridge.java \
            app/src/main/java/com/xspaceart/radar30/integrated/normalize/*.java \
            app/src/main/java/com/xspaceart/radar30/integrated/scanner/SourceHunter.java \
            app/src/main/java/com/xspaceart/radar30/integrated/pipeline/ReadingPipelineController.java \
            tools/PrecisionCoreTest.java tools/DualTargetCoreTest.java \
            tools/V063BalancedCalibrationTest.java tools/IntegratedOperationalTest.java tools/SourceOrderTrackerTest.java tools/ManualEchoReconcilerTest.java tools/ReadingPipelineControllerTest.java
          java -cp /tmp/aurum-host-tests PrecisionCoreTest
          java -cp /tmp/aurum-host-tests DualTargetCoreTest
          java -cp /tmp/aurum-host-tests V063BalancedCalibrationTest
          java -cp /tmp/aurum-host-tests IntegratedOperationalTest
          java -cp /tmp/aurum-host-tests SourceOrderTrackerTest
          java -cp /tmp/aurum-host-tests ManualEchoReconcilerTest
          java -cp /tmp/aurum-host-tests ReadingPipelineControllerTest

      - name: Build signed debug update
        shell: bash
        run: |
          set -euxo pipefail
          ROOT="$(dirname "$(find integrated -type f -name gradlew | head -1)")"
          cd "$ROOT"
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Audit package version signature and alignment
        shell: bash
        run: |
          set -euxo pipefail
          APK="$(find integrated -type f -path '*/build/outputs/apk/debug/*.apk' | head -1)"
          test -n "$APK"
          mkdir -p artifact
          cp "$APK" artifact/Aurum-AI-37-v0.7.3-Stability-Pipeline-STABLE.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/aapt2" dump badging artifact/Aurum-AI-37-v0.7.3-Stability-Pipeline-STABLE.apk | tee artifact/BADGING.txt
          grep -q "package: name='com.xspaceart.aurumai37.integratedlab.debug' versionCode='4' versionName='0.7.3-stability-pipeline-debug'" artifact/BADGING.txt
          "$BT/apksigner" verify --verbose --print-certs artifact/Aurum-AI-37-v0.7.3-Stability-Pipeline-STABLE.apk | tee artifact/SIGNATURE.txt
          grep -qi '663a96b89181b13c759512229e465ebc895136545f36d1cbd29f7d7e1ad561c4' artifact/SIGNATURE.txt
          "$BT/zipalign" -c -P 16 4 artifact/Aurum-AI-37-v0.7.3-Stability-Pipeline-STABLE.apk
          unzip -t artifact/Aurum-AI-37-v0.7.3-Stability-Pipeline-STABLE.apk >/dev/null
          sha256sum artifact/Aurum-AI-37-v0.7.3-Stability-Pipeline-STABLE.apk | tee artifact/SHA256SUMS.txt
          printf 'IMPLEMENTED=PASS\nSTATIC_VALIDATION=PASS\nHOST_TESTS=PASS\nCORE_PRESERVATION=PASS_17_OF_17\nCOMPILED=PASS\nPACKAGE=PASS\nSIGNATURE=PASS\nALIGNMENT=PASS\nPHYSICAL_S25FE=PENDING\n' | tee artifact/BUILD_STATUS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Aurum-AI-37-v0.7.3-Stability-Pipeline
          path: artifact/
          if-no-files-found: error
          retention-days: 7
